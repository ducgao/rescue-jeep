# Render Blueprint: New > Blueprint > chọn repo này là xong.
services:
  - type: web
    name: rescue-jeep
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
